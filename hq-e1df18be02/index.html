<style>
  /* Layout: one phone-first app. A sticky title bar with a scrolling tab row, one section at a time, cards with copy buttons. */
  :root {
    --bg: #f2f4f1; --card: #ffffff; --ink: #10231c; --muted: #5a6a62; --line: #dde3de;
    --brand: #0b6e4f; --brand-ink: #ffffff; --sun: #ffb21f; --sun-ink: #241500;
    --warn: #b45309; --warn-bg: #fff4e5; --bad: #c62828; --bad-bg: #fdecea; --good: #1b7f3b; --good-bg: #e7f6ec; --chip: #e8eee9;
    --display: "Red Hat Display", "Segoe UI", system-ui, sans-serif;
    --body: "Red Hat Text", "Segoe UI", system-ui, sans-serif;
    --mono: "Red Hat Mono", ui-monospace, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1512; --card: #15201b; --ink: #e8f1ec; --muted: #9fb1a7; --line: #26362e;
      --brand: #46c194; --brand-ink: #04140e; --warn: #f5a524; --warn-bg: #3a2c14; --bad: #ff7a7a; --bad-bg: #3a1d1d;
      --good: #4cc777; --good-bg: #173323; --chip: #1d2b25; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d1512; --card: #15201b; --ink: #e8f1ec; --muted: #9fb1a7; --line: #26362e;
    --brand: #46c194; --brand-ink: #04140e; --warn: #f5a524; --warn-bg: #3a2c14; --bad: #ff7a7a; --bad-bg: #3a1d1d;
    --good: #4cc777; --good-bg: #173323; --chip: #1d2b25; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--body); padding-inline: 16px; padding-block: 0 48px; }
  .wrap { max-width: 880px; margin: 0 auto; }
  h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
  p { margin: 0; }
  a { color: var(--brand); }
  button, select, textarea, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

  header.top { position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 5; padding-block: 12px 8px; margin-inline: -16px; padding-inline: 16px; border-bottom: 1px solid var(--line); }
  .title-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .title-row h1 { font-size: 26px; font-weight: 900; letter-spacing: -0.01em; }
  .pill { font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--warn-bg); color: var(--warn); }
  .pill.live { background: var(--good-bg); color: var(--good); }
  nav.tabs { display: flex; gap: 8px; overflow-x: auto; padding-block: 10px 4px; scrollbar-width: thin; }
  nav.tabs button { flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 16px; font-weight: 700; cursor: pointer; }
  nav.tabs button[aria-selected="true"] { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }

  main { padding-block: 18px; display: grid; gap: 14px; }
  section.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 10px; min-width: 0; }
  section.card h2 { font-size: 20px; font-weight: 900; }
  .muted { color: var(--muted); font-size: 14px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .stat { background: var(--chip); border-radius: 10px; padding: 12px; min-width: 0; }
  .stat b { display: block; font: 900 26px/1.1 var(--display); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .stat span { color: var(--muted); font-size: 13px; }
  .next { background: var(--sun); color: var(--sun-ink); border-radius: 14px; padding: 16px; display: grid; gap: 6px; }
  .next small { font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 12px; }
  .next b { font: 900 22px/1.2 var(--display); }
  .remind { border-left: 5px solid var(--warn); background: var(--warn-bg); border-radius: 8px; padding: 10px 12px; }
  .remind.bad { border-color: var(--bad); background: var(--bad-bg); }

  .btn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 8px 14px; font-weight: 700; cursor: pointer; text-decoration: none; color: var(--ink); display: inline-block; }
  .btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
  .btn.small { padding: 5px 10px; font-size: 13px; }
  .btn.danger { color: var(--bad); }

  .copyblock { background: var(--chip); border-radius: 10px; padding: 12px; display: grid; gap: 8px; min-width: 0; justify-items: start; }
  .copyblock .label { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .copyblock .txt { white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; width: 100%; }
  .copyblock .txt.mono { font: 500 14px/1.5 var(--mono); }

  .lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .lang button { border: 0; background: var(--card); padding: 5px 14px; font-weight: 700; cursor: pointer; }
  .lang button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); }

  details { border-top: 1px solid var(--line); padding-block: 8px; }
  details:first-of-type { border-top: 0; }
  details summary { cursor: pointer; font-weight: 700; }
  details > div { padding-top: 8px; display: grid; gap: 8px; }

  .item { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 8px; min-width: 0; }
  .item .name { font: 900 17px/1.2 var(--display); }
  .item .phone { font: 500 18px/1.2 var(--mono); user-select: text; }
  .tag { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); }
  .tag.warn { background: var(--warn-bg); color: var(--warn); }
  .tag.bad { background: var(--bad-bg); color: var(--bad); }
  .tag.good { background: var(--good-bg); color: var(--good); }
  input[type=text], input[type=number], input[type=date], input[type=email], select, textarea { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px; min-width: 0; }
  textarea { min-height: 64px; resize: vertical; }
  .fields { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
  .field { display: grid; gap: 3px; min-width: 0; }
  .field label { font-size: 12px; font-weight: 700; color: var(--muted); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chips button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 12px; font-weight: 700; cursor: pointer; font-size: 14px; }
  .chips button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  .task { display: flex; gap: 10px; align-items: flex-start; padding-block: 8px; border-top: 1px solid var(--line); }
  .task:first-of-type { border-top: 0; }
  .task input { width: 22px; height: 22px; margin-top: 2px; flex: none; accent-color: var(--brand); }
  .task label { display: grid; gap: 2px; cursor: pointer; }
  .task .done { text-decoration: line-through; color: var(--muted); }
  .cost { font-size: 12px; font-weight: 700; color: var(--warn); }

  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 8px; border-top: 1px solid var(--line); vertical-align: top; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .scroll { overflow-x: auto; }
  .price { font: 900 34px/1 var(--display); font-variant-numeric: tabular-nums; }
  .price small { font: 500 15px var(--body); color: var(--muted); }
  .in { color: var(--good); } .out { color: var(--bad); }
  .empty { color: var(--muted); text-align: center; padding: 18px 0; }
  @media (prefers-reduced-motion: no-preference) { .btn, nav.tabs button { transition: background-color .15s, color .15s; } }
</style>
<style>html, body { background: var(--bg); } body { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }</style>

    k.appendChild(el("p", { class: "muted", text: "No passwords or keys are stored on this page, on purpose." }));
    m.appendChild(k);
  }

  // ================================================================= shell
  var TABS = [["today", "Today", sToday], ["calls", "Calls", sCalls], ["clients", "Clients", sClients], ["demo", "Demo", sDemo], ["scripts", "Scripts", sScripts],
              ["emails", "Emails", sEmails], ["videos", "Videos", sVideos], ["posts", "Posts", sPosts], ["terms", "Terms", sTerms], ["money", "Money", sMoney],
              ["launch", "Launch", sLaunch], ["links", "Links", sLinks]];
  var current = "today";

  function paintStatus() {
    var live = taskDone("twilio"), s = $("status");
    s.textContent = live ? "Texting live" : "Not live yet"; s.className = "pill" + (live ? " live" : "");
  }
  function show(id) {
    current = id;
    try { localStorage.setItem("vbhq-tab", id); } catch (e) {}
    var tabs = $("tabs"); tabs.textContent = "";
    TABS.forEach(function (t) {
      var b = el("button", { text: t[1], role: "tab" }); b.setAttribute("aria-selected", String(t[0] === id));
      b.onclick = function () { show(t[0]); window.scrollTo(0, 0); }; tabs.appendChild(b);
    });
    var main = $("main"); main.textContent = "";
    for (var i = 0; i < TABS.length; i++) if (TABS[i][0] === id) TABS[i][2](main);
    paintStatus();
  }

  var start = "today";
  try { start = (location.hash || "").replace("#", "") || localStorage.getItem("vbhq-tab") || "today"; } catch (e) {}
  if (!TABS.some(function (t) { return t[0] === start; })) start = "today";
  show(start);

  // ================================================================= shared saving (when this page is allowed to use it)
  function connect() {
    if (!window.claude || !window.claude.use) return;
    window.claude.use("db").then(function (d) {
      if (!d) return;
      db = d;
      COLLS.forEach(function (coll) {
        var first = true;
        db.collection(coll).onSnapshot(function (snap) {
          var local = state[coll];
          if (first) {
            first = false;
            // The first time, anything saved only in this browser is sent up so nothing is lost.
            if (snap.empty) { Object.keys(local).forEach(function (id) { db.collection(coll).doc(id).set(local[id]).catch(function () {}); }); return; }
          }
          var next = {}, changed = false;
          snap.docs.forEach(function (doc) { next[doc.id] = doc.data(); });
          Object.keys(local).forEach(function (id) { if (!next[id] && snap.metadata.hasPendingWrites) next[id] = local[id]; });
          if (JSON.stringify(next) !== JSON.stringify(local)) { state[coll] = next; lsSet(coll, next); changed = true; }
          if (changed && !typing()) show(current);
        }, function () {});
      });
    }).catch(function () {});
  }
  connect();
})();
</script>
</body>
