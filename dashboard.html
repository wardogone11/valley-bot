<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leads Dashboard</title>
  <style>
    :root {
      --bg: #f4f5f7; --card: #ffffff; --ink: #1d1d1f; --muted: #5f6368; --line: #e3e5e8;
      --brand: #0b6e4f; --red: #c62828; --red-bg: #fdecea; --orange: #b45309; --orange-bg: #fff4e5;
      --green: #1b7f3b; --green-bg: #e7f6ec; --gray-bg: #eef0f2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121416; --card: #1c1f22; --ink: #eceef0; --muted: #a0a6ad; --line: #2c3035;
        --brand: #3fb489; --red: #ff6b6b; --red-bg: #3a1d1d; --orange: #f5a524; --orange-bg: #3a2c14;
        --green: #4cc777; --green-bg: #173323; --gray-bg: #272b30;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .wrap { max-width: 860px; margin: 0 auto; padding: 16px; }
    header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    h1 { margin: 8px 0; font-size: 26px; }
    .updated { color: var(--muted); font-size: 14px; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 12px 0 16px; }
    .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; cursor: pointer; text-align: left; color: inherit; font: inherit; }
    .stat b { display: block; font-size: 28px; line-height: 1.1; }
    .stat span { color: var(--muted); font-size: 14px; }
    .stat.active { outline: 2px solid var(--brand); }
    .stat.urgent b { color: var(--red); }
    .lead { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
    .lead.emergency { border-left: 5px solid var(--red); }
    .lead summary { list-style: none; cursor: pointer; padding: 14px 16px; }
    .lead summary::-webkit-details-marker { display: none; }
    .top { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
    .name { font-weight: 600; font-size: 17px; }
    .badge { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
    .b-emergency { color: var(--red); background: var(--red-bg); }
    .b-person { color: var(--orange); background: var(--orange-bg); }
    .b-ready { color: var(--green); background: var(--green-bg); }
    .b-chatting, .b-done, .b-notfit { color: var(--muted); background: var(--gray-bg); }
    .lead.done { opacity: .7; }
    .actions { padding: 0 16px 14px; display: flex; flex-wrap: wrap; gap: 8px; }
    .pick { margin: 0 0 14px; padding: 9px 12px; font: inherit; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); }
    .actions button { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; padding: 8px 14px; font: inherit; font-size: 14px; cursor: pointer; }
    .issue { margin: 6px 0 4px; }
    .settings { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; max-width: 640px; }
    .settings h2 { margin: 0 0 4px; font-size: 20px; }
    .field { display: block; margin: 16px 0 0; }
    .field.check { display: flex; gap: 10px; align-items: flex-start; }
    .field.check input { width: 20px; height: 20px; margin-top: 2px; flex: none; }
    .flabel { display: block; font-weight: 600; }
    .fhint { display: block; color: var(--muted); font-size: 14px; margin: 2px 0 6px; }
    .count { text-align: right; margin-top: 4px; }
    .settings textarea, .settings input[type=email], .settings input[type=tel], .settings input[type=url], .settings input[type=password] { width: 100%; box-sizing: border-box; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
    .save { margin-top: 18px; background: var(--brand); color: #fff; border: 0; border-radius: 8px; padding: 10px 22px; font: inherit; font-weight: 600; cursor: pointer; }
    .save:disabled { opacity: .6; }
    .share { margin-top: 16px; }
    .share textarea { width: 100%; box-sizing: border-box; font: 13px/1.4 ui-monospace, Consolas, monospace; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); resize: none; }
    .qr { background: #fff; padding: 12px; display: inline-block; border-radius: 10px; border: 1px solid var(--line); margin: 6px 0; }
    .qr img, .qr canvas { display: block; }
    .meta { color: var(--muted); font-size: 14px; display: flex; gap: 14px; flex-wrap: wrap; }
    .meta a { color: var(--brand); font-weight: 600; text-decoration: none; }
    .convo { border-top: 1px solid var(--line); padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 6px; background: var(--bg); }
    .shots { display: flex; flex-wrap: wrap; gap: 8px; }
    .shots img { width: 120px; height: 120px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); display: block; }
    .msg { max-width: 85%; padding: 7px 11px; border-radius: 12px; white-space: pre-wrap; font-size: 15px; }
    .msg.user { align-self: flex-start; background: var(--card); border: 1px solid var(--line); }
    .msg.assistant { align-self: flex-end; background: var(--brand); color: #fff; }
    .msg.owner { align-self: flex-end; background: #f5a524; color: #1d1d1f; }
    .msg.owner:before { content: attr(data-who); display: block; font-size: 11px; font-weight: 700; opacity: .75; }
    .b-owner { color: #1d1d1f; background: #fde7b8; }
    .reply { display: flex; gap: 8px; align-items: flex-end; margin-top: 6px; }
    .reply textarea { flex: 1; min-width: 0; font: inherit; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); resize: vertical; min-height: 42px; }
    .reply button, .inbox-row button { border: 0; background: var(--brand); color: #fff; border-radius: 10px; padding: 10px 16px; font: inherit; font-weight: 600; cursor: pointer; }
    .inbox-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
    .inbox-row button { background: var(--card); color: var(--ink); border: 1px solid var(--line); padding: 6px 12px; font-size: 13px; }
    .empty { text-align: center; color: var(--muted); padding: 40px 0; }
    .login { max-width: 380px; margin: 12vh auto; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 24px; }
    .login h1 { font-size: 22px; margin-top: 0; }
    .login input[type=password] { width: 100%; padding: 12px; font: inherit; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
    .login label.remember { display: flex; gap: 8px; align-items: center; margin: 12px 0; color: var(--muted); font-size: 14px; }
    .login button, .logout { background: var(--brand); color: #fff; border: 0; border-radius: 8px; padding: 12px 18px; font: inherit; font-weight: 600; cursor: pointer; }
    .logout { background: none; color: var(--muted); padding: 4px; font-weight: 400; font-size: 14px; }
    .error { color: var(--red); font-size: 14px; min-height: 20px; }
    .tabs { display: flex; gap: 8px; margin: 4px 0 12px; }
    .tabs button { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 8px 18px; font: inherit; font-weight: 600; cursor: pointer; }
    .tabs button.on { background: var(--brand); color: #fff; border-color: var(--brand); }
    .big { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 12px; font-size: 18px; line-height: 1.5; }
    .big small { display: block; color: var(--muted); font-size: 14px; margin-top: 6px; }
    .delta { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
    .delta.up { color: var(--green); }
    .delta.down { color: var(--orange); }
    .chart { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    .chart h2 { margin: 0 0 12px; font-size: 16px; }
    .bars { display: flex; align-items: flex-end; gap: 8px; height: 140px; }
    .bar { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; font-size: 12px; color: var(--muted); }
    .bar i { display: block; width: 100%; max-width: 48px; background: var(--brand); border-radius: 6px 6px 0 0; min-height: 2px; }
    .bar b { color: var(--ink); font-size: 13px; margin-bottom: 4px; }
    @media (max-width: 520px) { .stats { grid-template-columns: repeat(2, 1fr); } .stat b { font-size: 22px; } .stat span { font-size: 12px; } }
  </style>
</head>
<body>
  <div class="wrap" id="app"></div>

  <script>
    var API = "https://hlzmldcebgoeyxmrefcw.supabase.co/functions/v1/leads";
    var KEY_STORE = "vss-dashboard-key";
    var app = document.getElementById("app");
    var key = null, leads = [], me = null, filter = "all", business = "all", lastUpdated = null, timer = null;
    var view = "leads", results = null, resultsFor = null, loadingResults = false;
    var settings = null, settingsFor = null, loadingSettings = false, settingsNote = "";
    var openLead = null, drafts = {}, pendingRender = false;
    // Dashboard words in English or Spanish. Customer messages, names and addresses are never translated.
    var LANG_STORE = "vss-dashboard-lang";
    var lang = "en";
    try { lang = localStorage.getItem(LANG_STORE) || ((navigator.language || "").slice(0, 2) === "es" ? "es" : "en"); } catch (e) {}
    var ES = {
      "Leads dashboard": "Panel de clientes", "Dashboard password": "Contraseña del panel",
      "Remember on this computer": "Recordar en esta computadora", "Open": "Entrar",
      "That password didn't work.": "Esa contraseña no funcionó.",
      "Couldn't load leads. Check your internet and refresh the page.": "No se pudieron cargar los clientes. Revise su internet y recargue la página.",
      "EMERGENCY": "EMERGENCIA", "Wants a person": "Quiere hablar con alguien", "Ready to schedule": "Listo para agendar",
      "Still chatting": "Todavía escribiendo", "Not our trade": "No es nuestro ramo", "Done": "Terminado",
      "Leads": "Clientes", "Results": "Resultados", "Settings": "Ajustes", "Log out": "Salir",
      "Need a call now": "Llamar ahora", "All businesses": "Todos los negocios",
      "Nothing here right now.": "Nada por aquí ahorita.",
      "No leads yet. They'll show up here as soon as someone texts or chats.": "Todavía no hay clientes. Aparecerán aquí en cuanto alguien escriba.",
      "Name not given yet": "Sin nombre todavía", "Problem not described yet": "Problema sin describir todavía",
      "Heads up: ": "Ojo: ", "Best time: ": "Mejor hora: ", "No phone yet": "Sin teléfono todavía",
      "Website chat": "Chat de la página", "Missed call, texted back": "Llamada perdida, le mandamos texto", "Text": "Texto",
      "Undo done": "Deshacer terminado", "Mark done": "Marcar terminado", "Couldn't save, try again": "No se guardó, intente otra vez",
      "Sending…": "Enviando…", "They opted out of texts": "Pidió no recibir textos", "No number to text": "No hay número para textear",
      "Not a job you do": "No es un trabajo suyo", "Couldn't send, try again": "No se envió, intente otra vez",
      "This is turned off": "Esto está apagado", "Tech on the way": "Técnico en camino", "Tap again to text them": "Toque otra vez para mandarle el texto",
      "On the way text sent": "Texto de en camino enviado", "Sent less than 30 min ago": "Enviado hace menos de 30 min",
      "Ask for a review": "Pedir una reseña", "Tap again to text the review link": "Toque otra vez para mandar el enlace de reseña",
      "Review link sent": "Enlace de reseña enviado", "Already asked": "Ya se le pidió",
      "Loading conversation…": "Cargando conversación…", "Couldn't load the conversation.": "No se pudo cargar la conversación.",
      "Photo from the customer": "Foto del cliente",
      "Loading results…": "Cargando resultados…", "Couldn't load the results. Check your internet and try again.": "No se pudieron cargar los resultados. Revise su internet e intente otra vez.",
      "New customers": "Clientes nuevos", "After hours": "Fuera de horario", "Emergencies": "Emergencias", "Replies sent": "Respuestas enviadas",
      "By text": "Por texto", "On the website": "En la página", "Asked for a person": "Pidieron a una persona",
      "Missed calls texted back": "Llamadas perdidas con texto", "same as last week": "igual que la semana pasada",
      "New customers each day": "Clientes nuevos por día",
      "Pick a business above to see its settings.": "Escoja un negocio arriba para ver sus ajustes.",
      "Loading settings…": "Cargando ajustes…", "Couldn't load the settings. Check your internet and try again.": "No se pudieron cargar los ajustes. Revise su internet e intente otra vez.",
      "No texting number yet. Website chat works now.": "Todavía no hay número de texto. El chat de la página ya funciona.",
      "What the assistant can tell customers": "Lo que el asistente puede decirle a los clientes",
      "Hours, payment, brands, free estimates, emergency service. One per line. The assistant only shares what is written here.":
        "Horario, formas de pago, marcas, estimados gratis, servicio de emergencia. Uno por línea. El asistente solo comparte lo que está escrito aquí.",
      "Alert email": "Correo para avisos", "New customers and emergencies are emailed here.": "Los clientes nuevos y las emergencias llegan a este correo.",
      "Alert text number": "Celular para avisos", "Emergencies and new customers are texted to this cell phone.": "Las emergencias y los clientes nuevos llegan por texto a este celular.",
      "Morning reminder": "Recordatorio en la mañana", "Each morning, get a short list of customers still waiting on a call back.": "Cada mañana reciba una lista corta de los clientes que siguen esperando su llamada.",
      "Ask us to change these.": "Pídanos cambiarlos.",
      "Monday results email": "Correo de resultados los lunes",
      "Share your chat": "Comparta su chat", "Copy": "Copiar", "Copied": "Copiado", "Your chat link": "Su enlace de chat",
      "QR code": "Código QR", "Download QR code": "Descargar código QR",
      "Put the link on Facebook, Google and your invoices. Print the QR code on your truck, cards and door hangers.":
        "Ponga el enlace en Facebook, Google y sus facturas. Imprima el código QR en su troca, tarjetas y volantes.",
      "Add the chat box to your own website": "Agregue el chat a su propia página web",
      "Send that line to whoever runs your website. It goes just before the closing body tag.":
        "Mándele esa línea a quien maneja su página web. Va justo antes de la etiqueta de cierre del body.",
      "Facebook Messenger": "Facebook Messenger", "Reply on Facebook Messenger": "Contestar en Facebook Messenger",
      "On Facebook Messenger": "En Facebook Messenger",
      "Download all leads as a spreadsheet": "Descargar todos los clientes en una hoja de cálculo",
      "Every Monday, an email with how many customers Valle Listo caught last week.": "Cada lunes, un correo con cuántos clientes le consiguió Valle Listo la semana pasada.", "Save": "Guardar", "Saving…": "Guardando…", "Saved.": "Guardado.",
      "Couldn't save, try again.": "No se guardó, intente otra vez.", "On": "Encendido", "Off": "Apagado",
      "You're talking": "Usted está atendiendo", "Send": "Enviar",
      "The assistant is paused. You're answering this customer.": "El asistente está en pausa. Usted está atendiendo a este cliente.",
      "Let the assistant answer again": "Dejar que el asistente conteste otra vez",
      "The assistant is answering. Write below to take over.": "El asistente está contestando. Escriba abajo para atender usted.",
      "Text the customer from your Valle Listo number": "Mándele un texto al cliente desde su número de Valle Listo",
      "Reply in the customer's website chat": "Conteste en el chat de la página del cliente",
      "Updated ": "Actualizado ", " · refreshes every 30s ": " · se actualiza cada 30 s ",
    };
    var DAYS_ES = { Sun: "dom", Mon: "lun", Tue: "mar", Wed: "mié", Thu: "jue", Fri: "vie", Sat: "sáb" };
    function T(s) { return lang === "es" && ES[s] ? ES[s] : s; }

    try { key = localStorage.getItem(KEY_STORE); } catch (e) {}
    key ? refresh() : showLogin();

    function showLogin(message) {
      clearInterval(timer);
      app.innerHTML =
        '<form class="login"><h1>' + T("Leads dashboard") + '</h1>' +
        '<input type="password" placeholder="' + T("Dashboard password") + '" aria-label="' + T("Dashboard password") + '" autofocus>' +
        '<label class="remember"><input type="checkbox" checked> ' + T("Remember on this computer") + '</label>' +
        '<div class="error"></div><button type="submit">' + T("Open") + '</button></form>';
      var form = app.querySelector("form");
      form.querySelector(".error").textContent = T(message || "");
      form.onsubmit = function (e) {
        e.preventDefault();
        key = form.querySelector("input[type=password]").value.trim();
        if (form.querySelector("input[type=checkbox]").checked) {
          try { localStorage.setItem(KEY_STORE, key); } catch (e) {}
        }
        refresh();
      };
    }

    function call(body) {
      return fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Dashboard-Key": key },
        body: JSON.stringify(body || {}),
      }).then(function (r) {
        if (r.status === 401) throw new Error("auth");
        if (!r.ok) throw new Error("server");
        return r.json();
      });
    }

    function refresh() {
      call().then(function (data) {
        leads = data.leads;
        me = data.me;
        lastUpdated = new Date();
        // Don't redraw under someone typing a reply; redraw when they leave the box.
        var typing = document.activeElement && document.activeElement.classList.contains("replybox");
        if (typing) pendingRender = true; else render();
        if (view === "results") loadResults();
        clearInterval(timer);
        timer = setInterval(refresh, 30000);
      }).catch(function (err) {
        if (err.message === "auth") {
          try { localStorage.removeItem(KEY_STORE); } catch (e) {}
          showLogin("That password didn't work.");
        } else if (!leads.length) {
          app.innerHTML = "";
          app.appendChild(el("p", "empty", "Couldn't load leads. Check your internet and refresh the page."));
        }
      });
    }

    // Who needs attention first: emergencies, then people asking for a person,
    // then leads ready to schedule, then conversations still going.
    function kind(l) {
      if (l.closed_at) return "done";
      if (l.taken_over_at) return "owner";
      if (l.not_a_fit && l.status !== "handed_off") return "notfit";
      if (l.status === "handed_off" && l.emergency) return "emergency";
      if (l.status === "handed_off") return "person";
      if (l.status === "complete") return "ready";
      return "chatting";
    }
    var ORDER = { emergency: 0, person: 1, owner: 2, ready: 3, chatting: 4, notfit: 5, done: 6 };
    var LABEL = { emergency: "EMERGENCY", person: "Wants a person", owner: "You're talking", ready: "Ready to schedule", chatting: "Still chatting", notfit: "Not our trade", done: "Done" };

    function render() {
      var counts = { needsCall: 0, ready: 0, chatting: 0, done: 0 };
      leads.forEach(function (l) {
        if (business !== "all" && l.business_id !== business) return;
        var k = kind(l);
        if (k === "emergency" || k === "person") counts.needsCall++;
        else counts[k === "notfit" || k === "owner" ? "chatting" : k]++;
      });

      var shown = leads.filter(function (l) {
        var k = kind(l);
        if (filter === "needsCall") return k === "emergency" || k === "person";
        if (filter === "chatting") return k === "chatting" || k === "notfit" || k === "owner";
        if (business !== "all" && l.business_id !== business) return false;
        if (filter === "all") return k !== "done";
        return filter === k;
      }).sort(function (a, b) {
        return ORDER[kind(a)] - ORDER[kind(b)] || new Date(b.updated_at) - new Date(a.updated_at);
      });

      app.innerHTML = "";
      var header = el("header");
      var titleBox = el("div");
      titleBox.appendChild(el("h1", null, "Leads"));
      titleBox.appendChild(txt("div", "updated", me.name === "All businesses" ? T(me.name) : me.name));
      header.appendChild(titleBox);
      var right = el("div");
      right.appendChild(txt("span", "updated", T("Updated ") + lastUpdated.toLocaleTimeString(lang === "es" ? "es-MX" : [], { hour: "numeric", minute: "2-digit" }) + T(" · refreshes every 30s ")));
      var flip = el("button", "logout", lang === "es" ? "English" : "Español");
      flip.onclick = function () { lang = lang === "es" ? "en" : "es"; try { localStorage.setItem(LANG_STORE, lang); } catch (e) {} render(); };
      right.appendChild(flip);
      var out = el("button", "logout", "Log out");
      out.onclick = function () { try { localStorage.removeItem(KEY_STORE); } catch (e) {} key = null; leads = []; showLogin(); };
      right.appendChild(out);
      header.appendChild(right);
      app.appendChild(header);
      app.appendChild(viewTabs());
      if (view === "results") { renderResults(); return; }
      if (view === "settings") { renderSettings(); return; }

      var stats = el("div", "stats");
      [["needsCall", counts.needsCall, "Need a call now", counts.needsCall > 0],
       ["ready", counts.ready, "Ready to schedule"],
       ["chatting", counts.chatting, "Still chatting"],
       ["done", counts.done, "Done"]].forEach(function (s) {
        var b = el("button", "stat" + (filter === s[0] ? " active" : "") + (s[3] ? " urgent" : ""));
        b.appendChild(el("b", null, String(s[1])));
        b.appendChild(el("span", null, s[2]));
        b.onclick = function () { filter = filter === s[0] ? "all" : s[0]; render(); };
        stats.appendChild(b);
      });
      app.appendChild(stats);

      if (me.admin) app.appendChild(businessPicker(render));
      var dl = el("button", "logout", "Download all leads as a spreadsheet");
      dl.onclick = downloadLeads;
      app.appendChild(dl);

      if (!shown.length) {
        app.appendChild(el("p", "empty", leads.length ? "Nothing here right now." : "No leads yet. They'll show up here as soon as someone texts or chats."));
        return;
      }
      shown.forEach(function (l) { app.appendChild(card(l)); });
    }

    function viewTabs() {
      var tabs = el("div", "tabs");
      [["leads", "Leads"], ["results", "Results"], ["settings", "Settings"]].forEach(function (t) {
        var b = el("button", view === t[0] ? "on" : "", t[1]);
        b.onclick = function () { view = t[0]; render(); };
        tabs.appendChild(b);
      });
      return tabs;
    }

    function businessPicker(onChange) {
      var names = {};
      leads.forEach(function (l) { names[l.business_id] = l.business_name; });
      var pick = el("select", "pick");
      pick.id = "business-filter";
      pick.setAttribute("aria-label", "Business");
      pick.appendChild(new Option(T("All businesses"), "all"));
      Object.keys(names).sort().forEach(function (id) { pick.appendChild(new Option(names[id], id)); });
      pick.value = business;
      pick.onchange = function () { business = pick.value; onChange(); };
      return pick;
    }

    function loadResults() {
      if (loadingResults) return;
      loadingResults = true;
      var want = me.admin ? business : "all";
      call({ action: "stats", businessId: want }).then(function (d) {
        results = d; resultsFor = want;
      }).catch(function () {
        results = { error: true }; resultsFor = want;
      }).then(function () { loadingResults = false; render(); });
    }

    function loadSettings(want) {
      if (loadingSettings) return;
      loadingSettings = true;
      call({ action: "get_settings", businessId: want }).then(function (d) {
        settings = d; settingsFor = want;
      }).catch(function () {
        settings = { error: true }; settingsFor = want;
      }).then(function () { loadingSettings = false; render(); });
    }

    function renderSettings() {
      if (me.admin) app.appendChild(businessPicker(function () { settings = null; settingsNote = ""; render(); }));
      var want = me.admin ? business : "mine";
      if (me.admin && want === "all") { app.appendChild(el("p", "empty", "Pick a business above to see its settings.")); return; }
      if (!settings || settingsFor !== want) {
        app.appendChild(el("p", "empty", "Loading settings…"));
        loadSettings(want);
        return;
      }
      if (settings.error) { app.appendChild(el("p", "empty", "Couldn't load the settings. Check your internet and try again.")); return; }
      var s = settings.settings;
      var form = el("form", "settings");

      function field(label, hint, input) {
        var wrap = el("label", "field");
        wrap.appendChild(el("span", "flabel", label));
        if (hint) wrap.appendChild(el("span", "fhint", hint));
        wrap.appendChild(input);
        form.appendChild(wrap);
        return input;
      }
      function check(label, hint, on) {
        var wrap = el("label", "field check");
        var box = el("input");
        box.type = "checkbox";
        box.checked = Boolean(on);
        wrap.appendChild(box);
        var words = el("span");
        words.appendChild(el("span", "flabel", label));
        if (hint) words.appendChild(el("span", "fhint", hint));
        wrap.appendChild(words);
        form.appendChild(wrap);
        return box;
      }

      form.appendChild(txt("h2", null, s.name));
      form.appendChild(s.twilio_number ? txt("p", "fhint", (lang === "es" ? "Su número de Valle Listo: " : "Your Valle Listo number: ") + prettyPhone(s.twilio_number))
        : el("p", "fhint", "No texting number yet. Website chat works now."));

      var facts = el("textarea");
      facts.rows = 8;
      facts.maxLength = settings.maxFacts;
      facts.value = s.facts || "";
      field("What the assistant can tell customers", "Hours, payment, brands, free estimates, emergency service. One per line. The assistant only shares what is written here.", facts);
      var counter = el("span", "fhint count", "");
      function count() { counter.textContent = facts.value.length + (lang === "es" ? " de " : " of ") + settings.maxFacts; }
      facts.addEventListener("input", count); count();
      form.appendChild(counter);

      var email = el("input"); email.type = "email"; email.value = s.alert_email || ""; email.autocomplete = "email";
      field("Alert email", "New customers and emergencies are emailed here.", email);
      var phone = el("input"); phone.type = "tel"; phone.value = s.dispatcher_phone ? prettyPhone(s.dispatcher_phone) : ""; phone.autocomplete = "tel";
      field("Alert text number", "Emergencies and new customers are texted to this cell phone.", phone);

      var reminder = check("Morning reminder", "Each morning, get a short list of customers still waiting on a call back.", s.daily_reminder);
      var weekly = check("Monday results email", "Every Monday, an email with how many customers Valle Listo caught last week.", s.weekly_summary);

      var missed, reviews, link, pageId, pageToken;
      if (me.admin) {
        missed = check("Missed call text back (admin)", "Callers who reach the Valle Listo number get one text back.", s.missed_call_text);
        reviews = check("Review requests (admin)", "Shows the Ask for a review button on finished jobs.", s.review_requests);
        link = el("input"); link.type = "url"; link.value = s.review_link || "";
        field("Google review link (admin)", "Starts with https://", link);
        pageId = el("input"); pageId.type = "tel"; pageId.value = s.messenger_page_id || "";
        field("Facebook Page ID (admin)", "Facebook Messenger: " + (s.messenger_connected ? "connected" : "not connected") + ". Leave empty to disconnect.", pageId);
        pageToken = el("input"); pageToken.type = "password"; pageToken.autocomplete = "off";
        pageToken.placeholder = s.messenger_connected ? "Saved. Paste a new one only to replace it." : "Paste the Page access token from Meta";
        field("Facebook Page token (admin)", "Kept secret: it is never shown again after saving.", pageToken);
      } else {
        form.appendChild(txt("p", "fhint", (lang === "es" ? "Texto por llamada perdida: " : "Missed call text back: ") + T(s.missed_call_text ? "On" : "Off") +
          (lang === "es" ? ". Pedir reseñas: " : ". Review requests: ") + T(s.review_requests && s.review_link ? "On" : "Off") + ". " + T("Ask us to change these.")));
      }

      var save = el("button", "save", "Save");
      save.type = "submit";
      form.appendChild(save);
      var note = el("p", "fhint note", settingsNote);
      form.appendChild(note);

      form.onsubmit = function (e) {
        e.preventDefault();
        save.disabled = true;
        note.textContent = T("Saving…");
        var fields = { facts: facts.value, alert_email: email.value, dispatcher_phone: phone.value, daily_reminder: reminder.checked, weekly_summary: weekly.checked };
        if (me.admin) {
          fields.missed_call_text = missed.checked; fields.review_requests = reviews.checked; fields.review_link = link.value;
          fields.messenger_page_id = pageId.value; fields.messenger_page_token = pageToken.value;
        }
        fetch(API, {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Dashboard-Key": key },
          body: JSON.stringify({ action: "save_settings", businessId: me.admin ? business : "mine", fields: fields }),
        }).then(function (r) {
          return r.json().then(function (d) { if (!r.ok) throw new Error(d.error || "Couldn't save"); return d; });
        }).then(function (d) {
          settings = d; settingsNote = "Saved."; render();
        }).catch(function (err) {
          save.disabled = false;
          note.textContent = err.message || T("Couldn't save, try again.");
        });
      };
      app.appendChild(form);
      app.appendChild(shareBox(s));
    }

    // How customers reach this shop: its own chat link, a QR code to print, and the
    // one line that adds the chat box to the shop's own website.
    function shareBox(s) {
      var base = location.href.replace(/[^/]*$/, "");
      var link = base + "chat.html?shop=" + encodeURIComponent(s.id) + "&name=" + encodeURIComponent(s.name);
      var code = '<script src="' + base + 'widget.js" data-business="' + s.id + '" data-title="' + s.name.replace(/"/g, "&quot;") +
        '" data-endpoint="https://hlzmldcebgoeyxmrefcw.supabase.co/functions/v1/web-chat"></' + 'script>';
      var box = el("div", "settings share");
      box.appendChild(el("h2", null, "Share your chat"));
      box.appendChild(el("p", "fhint", "Put the link on Facebook, Google and your invoices. Print the QR code on your truck, cards and door hangers."));

      function copyRow(label, value) {
        var wrap = el("div", "field");
        wrap.appendChild(el("span", "flabel", label));
        var row = el("div", "reply");
        var out = el("textarea");
        out.readOnly = true;
        out.rows = value.length > 120 ? 3 : 1;
        out.value = value;
        var copy = el("button", null, "Copy");
        copy.type = "button";
        copy.onclick = function () {
          var done = function () { copy.textContent = T("Copied"); setTimeout(function () { copy.textContent = T("Copy"); }, 1500); };
          if (navigator.clipboard) navigator.clipboard.writeText(value).then(done, function () { out.select(); });
          else { out.select(); document.execCommand("copy"); done(); }
        };
        row.appendChild(out);
        row.appendChild(copy);
        wrap.appendChild(row);
        box.appendChild(wrap);
      }
      copyRow("Your chat link", link);

      var qrWrap = el("div", "field");
      qrWrap.appendChild(el("span", "flabel", "QR code"));
      var qr = el("div", "qr");
      qrWrap.appendChild(qr);
      var save = el("button", "save", "Download QR code");
      save.type = "button";
      qrWrap.appendChild(save);
      box.appendChild(qrWrap);
      withQr(function () {
        // eslint-disable-next-line no-undef
        new QRCode(qr, { text: link, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M });
        save.onclick = function () {
          var canvas = qr.querySelector("canvas");
          if (!canvas) return;
          var a = document.createElement("a");
          a.href = canvas.toDataURL("image/png");
          a.download = "valle-listo-qr-" + s.id + ".png";
          document.body.appendChild(a); a.click(); a.remove();
        };
      });

      copyRow("Add the chat box to your own website", code);
      box.appendChild(el("p", "fhint", "Send that line to whoever runs your website. It goes just before the closing body tag."));
      return box;
    }

    var qrLoading = null;
    function withQr(done) {
      if (window.QRCode) return done();
      if (!qrLoading) {
        qrLoading = [];
        var sc = document.createElement("script");
        sc.src = "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";
        sc.onload = function () { qrLoading.forEach(function (f) { f(); }); };
        document.head.appendChild(sc);
      }
      qrLoading.push(done);
    }

    function renderResults() {
      if (me.admin) app.appendChild(businessPicker(function () { results = null; render(); }));
      var want = me.admin ? business : "all";
      if (!results || resultsFor !== want) {
        app.appendChild(el("p", "empty", "Loading results…"));
        loadResults();
        return;
      }
      if (results.error) {
        app.appendChild(el("p", "empty", "Couldn't load the results. Check your internet and try again."));
        return;
      }
      var t = results.thisWeek, p = results.lastWeek;

      var big = el("div", "big");
      big.appendChild(document.createTextNode(lang === "es"
        ? "En los últimos 7 días, Valle Listo habló con " + t.leads + (t.leads === 1 ? " cliente nuevo" : " clientes nuevos") + ". " +
          t.afterHours + " escribieron fuera de horario, cuando nadie estaba para contestar. " +
          t.ready + (t.ready === 1 ? " está listo" : " están listos") + " para agendar, y " +
          t.emergencies + (t.emergencies === 1 ? " fue emergencia" : " fueron emergencias") + "."
        : "In the last 7 days, Valle Listo talked with " + t.leads + " new " + (t.leads === 1 ? "customer" : "customers") + ". " +
          t.afterHours + " wrote after hours, when nobody was there to answer. " +
          t.ready + " " + (t.ready === 1 ? "is" : "are") + " ready to schedule, and " +
          t.emergencies + " " + (t.emergencies === 1 ? "was an emergency" : "were emergencies") + "."
      ));
      big.appendChild(txt("small", null, lang === "es"
        ? "Fuera de horario quiere decir antes de las 8 AM, después de las 6 PM o en domingo (hora del centro)."
        : "After hours means " + results.hours + "."));
      app.appendChild(big);

      var grid = el("div", "stats");
      var askedT = Math.max(0, t.handedOff - t.emergencies), askedP = Math.max(0, p.handedOff - p.emergencies);
      [["New customers", t.leads, p.leads], ["Ready to schedule", t.ready, p.ready],
       ["After hours", t.afterHours, p.afterHours], ["Emergencies", t.emergencies, p.emergencies],
       ["Replies sent", t.answered, p.answered], ["By text", t.texts, p.texts],
       ["On the website", t.website, p.website], ["Asked for a person", askedT, askedP]
      ].concat((t.messenger || p.messenger) ? [["On Facebook Messenger", t.messenger || 0, p.messenger || 0]] : [])
      .concat((t.missedCalls || p.missedCalls) ? [["Missed calls texted back", t.missedCalls || 0, p.missedCalls || 0]] : [])
      .forEach(function (s) {
        var c = el("div", "stat");
        c.style.cursor = "default";
        c.appendChild(el("b", null, String(s[1])));
        c.appendChild(el("span", null, s[0]));
        var diff = s[1] - s[2];
        c.appendChild(el("span", "delta" + (diff > 0 ? " up" : diff < 0 ? " down" : ""),
          diff === 0 ? "same as last week" : lang === "es" ? (diff > 0 ? "sube " : "baja ") + Math.abs(diff) + " vs. la semana pasada"
            : (diff > 0 ? "up " : "down ") + Math.abs(diff) + " from last week"));
        grid.appendChild(c);
      });
      app.appendChild(grid);

      var chart = el("div", "chart");
      chart.appendChild(el("h2", null, "New customers each day"));
      var bars = el("div", "bars");
      var max = Math.max.apply(null, results.days.map(function (d) { return d.count; }).concat([1]));
      results.days.forEach(function (d) {
        var b = el("div", "bar");
        b.appendChild(el("b", null, String(d.count)));
        var i = el("i");
        i.style.height = Math.round((d.count / max) * 100) + "%";
        b.appendChild(i);
        b.appendChild(txt("span", null, lang === "es" ? DAYS_ES[d.label] || d.label : d.label));
        bars.appendChild(b);
      });
      chart.appendChild(bars);
      app.appendChild(chart);
    }

    function card(l) {
      var k = kind(l);
      var d = el("details", "lead" + (k === "emergency" ? " emergency" : "") + (k === "done" ? " done" : ""));
      var s = el("summary");
      var top = el("div", "top");
      top.appendChild(l.name ? txt("span", "name", l.name) : el("span", "name", "Name not given yet"));
      top.appendChild(el("span", "badge b-" + k, LABEL[k]));
      s.appendChild(top);
      s.appendChild(l.issue ? txt("div", "issue", l.issue) : el("div", "issue", "Problem not described yet"));
      if (l.urgency_note) s.appendChild(txt("div", "issue", T("Heads up: ") + l.urgency_note));
      if (l.preferred_time) s.appendChild(txt("div", "meta", T("Best time: ") + l.preferred_time));

      var meta = el("div", "meta");
      var phone = l.callback_phone || (l.channel === "sms" ? prettyPhone(l.phone) : null);
      if (phone) {
        var a = txt("a", null, phone);
        a.href = "tel:" + phone.replace(/[^\d+]/g, "");
        meta.appendChild(a);
      } else {
        meta.appendChild(el("span", null, "No phone yet"));
      }
      if (l.address) {
        var map = txt("a", null, l.address);
        map.href = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(l.address);
        map.target = "_blank";
        map.rel = "noopener";
        meta.appendChild(map);
      }
      var how = l.channel === "web" ? "Website chat" : l.channel === "messenger" ? "Facebook Messenger"
        : l.source === "missed_call" ? "Missed call, texted back" : "Text";
      meta.appendChild(txt("span", null, T(how) + " · " + ago(l.updated_at)));
      if (me.admin) meta.appendChild(txt("span", null, l.business_name));
      s.appendChild(meta);
      d.appendChild(s);

      var actions = el("div", "actions");
      var mark = el("button", null, l.closed_at ? "Undo done" : "Mark done");
      mark.onclick = function () {
        mark.disabled = true;
        call({ businessId: l.business_id, conversationId: l.phone, action: l.closed_at ? "reopen" : "close" })
          .then(refresh)
          .catch(function () { mark.disabled = false; mark.textContent = T("Couldn't save, try again"); });
      };
      actions.appendChild(mark);
      // Texts the shop sends with one button. Two taps, so a stray tap never texts a customer.
      function textButton(label, armedLabel, action, sentLabel, alreadyLabel) {
        var b = el("button", null, label);
        var armed = false;
        b.onclick = function () {
          if (!armed) { armed = true; b.textContent = T(armedLabel); return; }
          b.disabled = true;
          b.textContent = T("Sending…");
          call({ businessId: l.business_id, conversationId: l.phone, action: action }).then(function (r) {
            var said = { sent: sentLabel, already_sent: alreadyLabel, opted_out: "They opted out of texts",
              no_number: "No number to text", not_a_fit: "Not a job you do", failed: "Couldn't send, try again" };
            b.textContent = T(said[r.outcome] || "This is turned off");
            if (r.outcome === "failed") { b.disabled = false; armed = false; }
          }).catch(function () { b.disabled = false; armed = false; b.textContent = T("Couldn't send, try again"); });
        };
        return b;
      }
      // Tech on the way: for real jobs that aren't marked done yet.
      if (!l.not_a_fit && phone && !l.closed_at && (l.status === "complete" || l.status === "handed_off")) {
        actions.appendChild(textButton(l.on_the_way_at ? (lang === "es" ? "En camino enviado " + ago(l.on_the_way_at) + ", enviar otra vez"
          : "On the way sent " + ago(l.on_the_way_at) + ", send again") : "Tech on the way",
          "Tap again to text them", "on_the_way", "On the way text sent", "Sent less than 30 min ago"));
      }
      // Review requests: only for finished jobs, once per customer, and only when the shop turned them on.
      if (l.reviews_on && !l.not_a_fit && phone && (l.status === "complete" || l.closed_at)) {
        var review = textButton("Ask for a review", "Tap again to text the review link", "review", "Review link sent", "Already asked");
        if (l.review_requested_at) { review.textContent = (lang === "es" ? "Reseña pedida " : "Review asked ") + ago(l.review_requested_at); review.disabled = true; }
        actions.appendChild(review);
      }
      d.appendChild(actions);

      var leadKey = l.business_id + "|" + l.phone;
      if (openLead === leadKey) d.open = true;
      d.addEventListener("toggle", function () {
        if (!d.open) { if (openLead === leadKey) openLead = null; return; }
        openLead = leadKey;
        if (d.querySelector(".convo")) return;
        var convo = el("div", "convo", "Loading conversation…");
        d.appendChild(convo);
        call({ businessId: l.business_id, conversationId: l.phone }).then(function (data) {
          convo.textContent = "";
          data.messages.forEach(function (m) {
            var b = txt("div", "msg " + m.role, m.content);
            if (m.role === "owner") b.setAttribute("data-who", lang === "es" ? "Usted" : "You");
            convo.appendChild(b);
          });
          if (data.photos && data.photos.length) {
            var shots = el("div", "shots");
            data.photos.forEach(function (p) {
              var a = el("a"); a.href = p.url; a.target = "_blank"; a.rel = "noopener";
              var img = el("img"); img.src = p.url; img.alt = T("Photo from the customer"); img.loading = "lazy";
              a.appendChild(img); shots.appendChild(a);
            });
            convo.appendChild(shots);
          }
          // After a send or hand back, a refresh redraws the list and reopens this conversation.
          convo.appendChild(inbox(l, leadKey, refresh));
        }).catch(function () { convo.textContent = T("Couldn't load the conversation."); });
      });
      return d;
    }

    // The shop answers the customer itself. By text it goes from the shop's number; in the website
    // chat it shows up in the customer's chat box. Replying pauses the bot for this customer.
    function inbox(l, leadKey, reload) {
      var box = el("div");
      var row = el("div", "inbox-row");
      if (l.taken_over_at) {
        row.appendChild(el("span", null, "The assistant is paused. You're answering this customer."));
        var back = el("button", null, "Let the assistant answer again");
        back.onclick = function () {
          back.disabled = true;
          call({ businessId: l.business_id, conversationId: l.phone, action: "hand_back" }).then(reload)
            .catch(function () { back.disabled = false; back.textContent = T("Couldn't save, try again"); });
        };
        row.appendChild(back);
      } else {
        row.appendChild(el("span", null, "The assistant is answering. Write below to take over."));
      }
      box.appendChild(row);

      var form = el("form", "reply");
      var input = el("textarea", "replybox");
      input.rows = 2;
      input.maxLength = 1000;
      input.placeholder = T(l.channel === "sms" ? "Text the customer from your Valle Listo number"
        : l.channel === "messenger" ? "Reply on Facebook Messenger" : "Reply in the customer's website chat");
      input.value = drafts[leadKey] || "";
      input.addEventListener("input", function () { drafts[leadKey] = input.value; });
      input.addEventListener("blur", function () { if (pendingRender) { pendingRender = false; setTimeout(render, 0); } });
      var go = el("button", null, "Send");
      go.type = "submit";
      form.appendChild(input);
      form.appendChild(go);
      var note = el("div", "inbox-row");
      form.onsubmit = function (e) {
        e.preventDefault();
        var message = input.value.trim();
        if (!message) return;
        go.disabled = true;
        note.textContent = T("Sending…");
        call({ businessId: l.business_id, conversationId: l.phone, action: "reply", message: message }).then(function (r) {
          if (r.outcome === "sent") { drafts[leadKey] = ""; reload(); return; }
          var said = { opted_out: "They opted out of texts", no_number: "No number to text", failed: "Couldn't send, try again" };
          note.textContent = T(said[r.outcome] || "Couldn't send, try again");
          go.disabled = false;
        }).catch(function () { go.disabled = false; note.textContent = T("Couldn't send, try again"); });
      };
      box.appendChild(form);
      box.appendChild(note);
      return box;
    }

    // Every lead this dashboard can see (the chosen business for the admin), as a CSV file that opens in Excel.
    function downloadLeads() {
      var rows = leads.filter(function (l) { return business === "all" || l.business_id === business; });
      var head = ["Date", "Name", "Phone", "Address", "Problem", "Status", "Emergency", "Best time", "Heads up", "Came in by", "Done"];
      if (me.admin) head.push("Business");
      var lines = [head].concat(rows.map(function (l) {
        var r = [new Date(l.created_at).toLocaleString(), l.name || "", l.callback_phone || (l.channel === "sms" ? prettyPhone(l.phone) : ""),
          l.address || "", l.issue || "", LABEL[kind(l)], l.emergency ? "Yes" : "", l.preferred_time || "", l.urgency_note || "",
          l.channel === "sms" ? (l.source === "missed_call" ? "Missed call" : "Text") : l.channel === "messenger" ? "Facebook Messenger" : "Website chat",
          l.closed_at ? "Yes" : ""];
        if (me.admin) r.push(l.business_name);
        return r;
      })).map(function (r) {
        return r.map(function (v) {
          var s = String(v);
          // A cell starting with = + - @ could run as a formula in Excel; a leading ' keeps it plain text.
          if (/^[=+\-@]/.test(s)) s = "'" + s;
          return '"' + s.replace(/"/g, '""') + '"';
        }).join(",");
      });
      var blob = new Blob(["\ufeff" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "valle-listo-leads-" + new Date().toISOString().slice(0, 10) + ".csv";
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    }

    function prettyPhone(p) {
      var m = /^\+1(\d{3})(\d{3})(\d{4})$/.exec(p);
      return m ? m[1] + "-" + m[2] + "-" + m[3] : p;
    }

    function ago(iso) {
      var mins = Math.round((Date.now() - new Date(iso)) / 60000);
      if (mins < 1) return lang === "es" ? "ahorita" : "just now";
      if (mins < 60) return lang === "es" ? "hace " + mins + " min" : mins + " min ago";
      var hrs = Math.round(mins / 60);
      if (hrs < 24) return lang === "es" ? "hace " + hrs + " h" : hrs + " hr ago";
      return new Date(iso).toLocaleDateString(lang === "es" ? "es-MX" : [], { month: "short", day: "numeric" });
    }

    function el(tag, cls, text) {
      var n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text != null) n.textContent = T(text);
      return n;
    }
    // Same as el, but the text is shown exactly as written (customer words, names, addresses).
    function txt(tag, cls, text) {
      var n = el(tag, cls);
      if (text != null) n.textContent = text;
      return n;
    }
  </script>
</body>
</html>
